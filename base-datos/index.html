<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Base de datos · Control de Red</title><link rel="stylesheet" href="base-datos.css"></head><body>
<aside class="sidebar"><div class="brand"><span class="drop">◉</span><div><b>Control de Red</b><small>Analítica hidráulica</small></div></div><nav><a class="nav" href="../index.html">▦ <span>Resumen de red</span></a><button class="nav">⌁ <span>Captación</span></button><button class="nav">⇄ <span>Intercambios</span></button><button class="nav">⌂ <span>Distribución</span></button><a class="nav active" href="index.html">▤ <span>Base de datos</span></a><button class="nav">⚙ <span>Configuración</span></button></nav><div class="sidefoot"><span class="status"></span> Edición local</div></aside>
<main><header><div><p class="eyebrow">GESTIÓN DE DATOS</p><h1>Base de datos</h1><p>Edita, filtra y descarga una copia actualizada del libro Excel.</p></div><div class="headerActions"><button id="addRow" class="secondary">＋ Añadir registro</button><button id="saveExcel" class="primary">↓ Guardar Excel</button></div></header>
<section class="tabs"><button class="tab active">Balance de poblaciones <span id="dirtyBadge" hidden>0 cambios</span></button><button class="tab disabled" title="Disponible próximamente">Próxima tabla</button></section>
<section class="panel"><div class="toolbar"><div class="field"><label>Año</label><select id="yearFilter"><option value="">Todos</option></select></div><div class="field"><label>Mes</label><select id="monthFilter"><option value="">Todos</option></select></div><div class="field grow"><label>Búsqueda general</label><input id="globalFilter" placeholder="Buscar en cualquier columna..."></div><button id="clearFilters" class="ghost">Limpiar filtros</button></div>
<div class="summary"><span id="rowCount">Cargando…</span><span>Los cambios se conservan en esta sesión hasta descargar el Excel.</span></div>
<div class="tableWrap"><table><thead><tr id="headRow"></tr><tr id="filterRow" class="filters"></tr></thead><tbody id="tableBody"></tbody></table></div>
<div class="pagination"><label>Filas <select id="pageSize"><option>25</option><option selected>50</option><option>100</option><option>250</option></select></label><button id="prevPage">‹</button><span id="pageInfo"></span><button id="nextPage">›</button></div></section></main>
<dialog id="editDialog"><form method="dialog"><div class="modalHead"><div><p class="eyebrow">REGISTRO</p><h2 id="modalTitle">Editar registro</h2></div><button class="iconBtn" value="cancel">×</button></div><div id="editFields" class="formGrid"></div><div class="modalActions"><button value="cancel" class="ghost">Cancelar</button><button id="confirmEdit" value="default" class="primary">Guardar cambios</button></div></form></dialog>
<div id="toast"></div><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="balance-poblaciones/tab.js"></script></body></html>
